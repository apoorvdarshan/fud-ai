# Fails a pull request that introduces a dependency with a known vulnerability
# (npm under web/, Gradle under android/, pip under scripts/, GitHub Actions),
# using GitHub's dependency graph diff for the PR.

name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the pull request supersedes its older review.
concurrency:
  group: dependency-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
