<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workout review</title>
<style>
:root{color-scheme:dark;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111318;color:#f3f4f6}
*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer;border:1px solid #495160;border-radius:8px;background:#242a34;color:inherit;padding:9px 13px}button:disabled{opacity:.42;cursor:default}button:hover:not(:disabled){background:#343c49}button:focus-visible,textarea:focus-visible{outline:3px solid #ff7196;outline-offset:2px}[hidden]{display:none!important}
header{background:#181c24;padding:14px 22px;border-bottom:1px solid #353c49}header h1{font-size:17px;margin:0 0 5px}p{margin:6px 0}.muted{color:#aeb8c8;font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}.toolbar .spacer{flex:1}
main{max-width:1380px;margin:auto;padding:20px}h2{font-size:clamp(20px,2.6vw,30px);letter-spacing:-.025em;margin:0;overflow-wrap:anywhere}.exercise-heading{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.badge{font:12px ui-monospace,monospace;color:#ff95b0;white-space:nowrap}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{min-width:0;border:1px solid #3d4553;border-radius:10px;overflow:hidden}.panel-head{padding:9px 12px;background:#242a34;display:flex;justify-content:space-between;font-size:13px;font-weight:600}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#424a57}.cell{min-width:0;margin:0}.cell figcaption{text-align:center;font-size:11px;font-weight:600;padding:6px;background:#242a34;color:#c7d0df}.stage{aspect-ratio:4/3;position:relative;overflow:hidden;background:#08090b}.light .stage{background:#f3f4f6}.stage img{display:block;width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.light .panel-head{background:#dfe4eb;color:#192334}.light figcaption{background:#e8ecf1;color:#394558}
.review{margin-top:18px;padding:16px;border:1px solid #3d4553;border-radius:10px;background:#191e27}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}#approve{background:#26493e;border-color:#4b8e77}textarea{width:100%;min-height:64px;resize:vertical;border:1px solid #495160;border-radius:8px;background:#11161f;color:inherit;padding:10px;margin-top:10px}details{margin-top:14px;font-size:13px;color:#bbc5d5}li{margin:5px 0}#error{color:#ffb6b6}#load-state{font-size:12px;color:#bec8d8}#position{font:12px ui-monospace,monospace;min-width:55px;text-align:center}#frame-label{font:12px ui-monospace,monospace}#decision-state{color:#92d8b9}
.exercise-navigation{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 0 4px}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.total{background:#242a34;border:1px solid #3d4553;border-radius:8px;padding:10px 12px}.total strong{display:block;font-size:23px}.total span{font-size:12px;color:#bdc8d8}.total:first-child strong{color:#92d8b9}
@media(max-width:640px){main{padding:12px}.views{grid-template-columns:1fr;gap:12px}header{padding:12px}.toolbar .spacer{display:none}.exercise-heading{align-items:flex-start}.badge{white-space:normal}}
</style></head><body>
<header><h1>Workout image review</h1><p class="muted">One exercise at a time · Original on the left, candidate on the right · App images stay unchanged</p>
<div class="totals" aria-label="All workout exercises"><div class="total"><strong id="total-approved">—</strong><span>Approved</span></div><div class="total"><strong id="total-progress">—</strong><span>In progress</span></div><div class="total"><strong id="total-not-started">—</strong><span>Not started</span></div></div><p id="total-summary" class="muted" aria-live="polite"></p>
<div class="toolbar"><button id="play">Pause</button><button id="step">Next frame</button><button id="speed">Slow playback</button><span id="frame-label">Frame 1 / 4</span><span class="spacer"></span><button id="refresh">Refresh results</button><button id="export">Export decisions</button></div>
<p id="summary" class="muted" aria-live="polite"></p><p id="error" role="alert"></p></header>
<main><section id="exercise"><div class="exercise-heading"><h2 id="name"></h2><span class="badge" id="status"></span></div><div class="views" id="views"></div>
<div class="review"><p id="load-state" aria-live="polite"></p><p id="decision-state"></p><textarea id="notes" aria-label="Review notes" placeholder="What needs changing?"></textarea><div class="actions"><button id="repair">Needs more work</button><button id="keep">Keep original</button><button id="clear">Clear local decision</button></div><details><summary>Reported issues</summary><ul id="findings"></ul></details></div><nav class="exercise-navigation" aria-label="Exercise review"><span id="position"></span><button id="previous">← Previous</button><button id="approve">Approve</button><button id="next">Next →</button></nav></section><p id="empty" hidden>No new review sets yet. Refresh results shortly.</p></main>
<script>
let data,selectedId=null,frame=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,slow=false,timer,busy=false,epoch=0,seen=new Set(),failed=false,panels=[],decisions={},storageKey,refreshing=false,saving=false,decisionRevision=0;
const $=id=>document.getElementById(id);
const row=()=>data?.rows.find(r=>r.id===selectedId);
function signature(r){return [...r.sourceHashes,...r.hashes].join('|')}
function validDecision(r,d){return d?.signature===signature(r)&&['pending','approve_candidate','needs_more_work','keep_original','defer'].includes(d.decision)}
function effectiveDecision(r,d){return validDecision(r,d)?d.decision:r.humanDecision||(r.humanApproved?'approve_candidate':'pending')}
function decisionPayload(d,ds){return {batch:d.batch,exportedAt:new Date().toISOString(),approvalDoesNotPromote:true,decisions:Object.fromEntries(d.rows.map(r=>{const old=ds[r.id],valid=validDecision(r,old);return [r.id,{decision:effectiveDecision(r,old),notes:old?.notes||'',signature:signature(r),sourceHashes:r.sourceHashes,candidateHashes:r.hashes,stalePreviousDecision:!!old&&!valid}]}))}}
function imageUrls(r,f){return [r.sources[f],r.candidates[f],r.sources[4+f],r.candidates[4+f]]}
function summary(){if(!data)return;const t=data.totals;if(t){$('total-approved').textContent=t.approved+' / '+t.total;$('total-progress').textContent=t.inProgress;$('total-not-started').textContent=t.notStarted;$('total-summary').textContent=t.total+' total exercises · '+t.readyForReview+' ready for review (included in progress) · Rejected sets return to correction';}$('summary').textContent=data.count+' undecided exercises to judge · Approved and rejected sets are hidden';}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(decisions))}catch{$('error').textContent='Local save unavailable. Export your decisions before closing.'}summary()}
function approval(){const r=row();if(!r)return;$('approve').disabled=saving||seen.size!==8||failed||r.available!==8;$('load-state').textContent=failed?'Image changed or failed to load. Refresh results.':seen.size===8?'All 8 frames displayed in both backgrounds. Ready for your decision.':seen.size+'/8 frames displayed · both genders and both backgrounds play together';$('decision-state').textContent=saving?'Saving…':['approve_candidate','keep_original'].includes(effectiveDecision(r,decisions[r.id]))?'Approved — saved for these exact frames':effectiveDecision(r,decisions[r.id])==='needs_more_work'?'In progress — returned to correction queue':''}
function release(){epoch++;for(const p of panels)for(const img of [p.before,p.after])img.removeAttribute('src')}
function make(tag,text){const el=document.createElement(tag);if(text)el.textContent=text;return el}
function renderExercise(){
 release();panels=[];seen=new Set();failed=false;$('views').replaceChildren();const r=row();$('exercise').hidden=!r;$('empty').hidden=!!r;if(!r)return;
 const i=data.rows.findIndex(x=>x.id===r.id);$('position').textContent=(i+1)+' / '+data.rows.length;$('previous').disabled=i===0;$('next').disabled=i===data.rows.length-1;
 $('name').textContent=r.id.replaceAll('_',' ');$('status').textContent=r.status;$('findings').replaceChildren();for(const f of r.findings||[])$('findings').append(make('li',f));$('notes').value=decisions[r.id]?.notes||r.savedNotes||'';
 for(const gender of ['male','female'])for(const background of ['dark','light']){
  const section=make('section');section.className='panel '+background;const heading=make('div');heading.className='panel-head';heading.append(make('span',gender==='male'?'Male':'Female'),make('span',background==='dark'?'Dark background':'Light background'));section.append(heading);
  const comparison=make('div');comparison.className='comparison';const panel={gender};
  for(const side of ['before','after']){const fig=make('figure');fig.className='cell';fig.append(make('figcaption',side==='before'?'Original':'Candidate'));const stage=make('div');stage.className='stage';const img=make('img');img.alt=r.id+' '+gender+' '+(side==='before'?'original':'candidate');stage.append(img);fig.append(stage);comparison.append(fig);panel[side]=img;}
  section.append(comparison);$('views').append(section);panels.push(panel);
 }
 approval();draw();summary();
}
async function draw(){
 const r=row();if(!r||document.hidden||busy)return;const token=epoch,id=r.id,f=frame;busy=true;
 const loaded=[];
 try{
  const urls=imageUrls(r,f);
  const imgs=await Promise.all(urls.map(async url=>{if(!url)throw Error('Missing frame');const img=new Image();loaded.push(img);img.src=url;await img.decode();if(!img.naturalWidth)throw Error('Invalid frame');return img}));
  if(token!==epoch||id!==selectedId||document.hidden||f!==frame)return;
  for(const p of panels){const offset=p.gender==='male'?0:2;p.before.src=imgs[offset].src;p.after.src=imgs[offset+1].src;}
  seen.add(f);seen.add(4+f);failed=false;$('frame-label').textContent='Frame '+(f+1)+' / 4';approval();
 }catch(e){if(token===epoch){failed=true;seen.delete(f);seen.delete(4+f);for(const p of panels){p.before.removeAttribute('src');p.after.removeAttribute('src')}if(decisions[r.id]?.decision==='approve_candidate'){decisions[r.id].decision='pending';save()}approval();}}
 finally{for(const img of loaded)img.removeAttribute('src');busy=false;if(token!==epoch&&!document.hidden)draw();}
}
function clock(){clearInterval(timer);$('play').textContent=playing?'Pause':'Play';if(playing&&!document.hidden)timer=setInterval(()=>{if(busy)return;frame=(frame+1)%4;draw()},slow?1100:650)}
function move(delta){const i=data?.rows.findIndex(r=>r.id===selectedId),next=data?.rows[i+delta];if(!next)return;selectedId=next.id;frame=0;renderExercise()}
async function decide(value){const r=row();if(!r||saving)return;if(value==='approve_candidate'&&(seen.size!==8||failed||r.available!==8))return;saving=true;decisionRevision++;approval();try{const payload={exerciseId:r.id,decision:value,notes:$('notes').value,sourceHashes:r.sourceHashes,candidateHashes:r.hashes};const response=await fetch('/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw Error(result.error||'Could not save decision');decisions[r.id]={...result.saved,signature:signature(r)};r.humanDecision=value;r.humanApproved=['approve_candidate','keep_original'].includes(value);r.status=r.humanApproved?'Approved by you · Saved':value==='needs_more_work'?'In progress · Returned for correction':'Awaiting your approval';if(result.totals)data.totals=result.totals;$('error').textContent='';save();if(value!=='pending'){const index=data.rows.findIndex(x=>x.id===r.id);data.rows=data.rows.filter(x=>x.id!==r.id);data.count=data.rows.length;if(selectedId===r.id)selectedId=data.rows[Math.min(Math.max(index,0),data.rows.length-1)]?.id||null;frame=0;renderExercise();summary();}}catch(e){$('error').textContent=String(e)}finally{saving=false;approval()}}
async function refresh(background=false){
 if(refreshing||saving)return;refreshing=true;const revision=decisionRevision;
 try{const res=await fetch('/manifest.json',{cache:'no-store'});if(!res.ok)throw Error('Could not load results');const next=await res.json(),key='fud-workout-'+next.batch+'-review-v1';
 if(saving||revision!==decisionRevision)return;
 if(key!==storageKey){storageKey=key;try{const parsed=JSON.parse(localStorage.getItem(key)||'{}');decisions=parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{}}catch{decisions={}}}
 const previous=row(),current=next.rows.find(r=>r.id===selectedId),unchanged=background&&previous&&current&&signature(previous)===signature(current);
 data=next;if(!current)selectedId=data.rows[0]?.id||null;
 if(unchanged){const i=data.rows.findIndex(r=>r.id===selectedId);$('position').textContent=(i+1)+' / '+data.rows.length;$('previous').disabled=i===0;$('next').disabled=i===data.rows.length-1;summary();}
 else{frame=0;renderExercise();summary();}$('error').textContent='';
 }catch(e){$('error').textContent=String(e)}finally{refreshing=false}
}
$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('play').onclick=()=>{playing=!playing;clock()};
$('step').onclick=()=>{if(busy)return;playing=false;clock();frame=(frame+1)%4;draw()};$('speed').onclick=()=>{slow=!slow;$('speed').textContent=slow?'Normal playback':'Slow playback';clock()};
$('refresh').onclick=()=>refresh();$('approve').onclick=()=>decide('approve_candidate');$('repair').onclick=()=>decide('needs_more_work');$('keep').onclick=()=>decide('keep_original');$('clear').onclick=()=>decide('pending');
$('notes').oninput=()=>{const r=row();if(!r)return;const previous=decisions[r.id];decisions[r.id]={...(validDecision(r,previous)?previous:{decision:'pending',signature:signature(r)}),notes:$('notes').value};save()};
$('export').onclick=async()=>{if(!data)return;try{const res=await fetch('/decisions.json',{cache:'no-store'});if(!res.ok)throw Error('Could not export saved decisions');const payload=await res.json(),url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=make('a');a.href=url;a.download='workout-'+data.batch+'-human-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){$('error').textContent=String(e)}};
document.addEventListener('visibilitychange',()=>{clock();if(document.hidden)release();else draw()});
function watchResults(){setInterval(()=>{if(!document.hidden&&!saving)refresh(true)},15000)}
refresh();clock();watchResults();
</script></body></html>
