name: Feature request
description: Suggest an idea or enhancement for Fud AI
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Clear problem statements help more than solution-only requests.
        Check [existing issues](https://github.com/apoorvdarshan/fud-ai/issues) first to avoid duplicates.
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms this should cover
      description: Fud AI aims for iOS/Android parity when practical.
      multiple: true
      options:
        - iOS
        - Android
        - Watch
        - Widget
        - Web (fud-ai.app)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what gets in the way today?
      placeholder: I'm always frustrated when…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Fud AI to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, screenshots, related apps, or links welcome.
