# Fails a pull request that introduces dependencies with known high/critical
# vulnerabilities (via the GitHub dependency graph: web/package-lock.json,
# android/gradle/libs.versions.toml, scripts/requirements-*.txt, workflows).

name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
