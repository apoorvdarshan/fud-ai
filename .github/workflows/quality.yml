name: Quality checks

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: web
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            android
            shared
          persist-credentials: false
      # Verifies the checksum of android/gradle/wrapper/gradle-wrapper.jar against
      # Gradle's published releases, so a tampered wrapper binary fails CI.
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # Default packages include obsolete `tools`, which sdkmanager no longer ships.
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # -PworkoutVectors=none: release parity (manifest only). Store builds never bundle
      # the ~7,000-frame / 1.2 GB workout corpus (shared/workout-vectors); frames come
      # from the CDN at runtime. Debug builds default to the small sample pack, which
      # tests and lint do not need, so skip copying it here.
      - name: Unit tests and release lint
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease -PworkoutVectors=none
      - name: Retain test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-quality-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-release.*
