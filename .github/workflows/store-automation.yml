# Store automation dry-run — validates catalog + prepares metadata.
# Never uploads to App Store / Play / RevenueCat. Safe to run anytime.
#
# Live paths stay behind repository variables documented in store/README.md
# and store/gates.env.example (all default OFF).
#
# Pull requests are checked by pull_request; push covers main only, so a PR
# branch is not dry-run twice. A newer push to a pull request cancels its older
# run; main and manual runs are never cancelled.

name: Store automation (dry-run)

on:
  push:
    branches: [main]
    paths:
      - "store/**"
      - "scripts/store/**"
      - "scripts/release_notes.py"
      - "APPSTORE.md"
      - "PLAYSTORE.md"
      - "docs/HOSTED_AI_REVENUECAT.md"
      - ".github/workflows/store-automation.yml"
      - ".github/workflows/ios-release.yml"
      - ".github/workflows/android-release.yml"
      - "requirements-store.txt"
      - "ios/calorietracker/Info.plist"
      - "ios/calorietracker.xcodeproj/project.pbxproj"
  pull_request:
    paths:
      - "store/**"
      - "scripts/store/**"
      - "scripts/release_notes.py"
      - "APPSTORE.md"
      - "PLAYSTORE.md"
      - "docs/HOSTED_AI_REVENUECAT.md"
      - ".github/workflows/store-automation.yml"
      - ".github/workflows/ios-release.yml"
      - ".github/workflows/android-release.yml"
      - "requirements-store.txt"
      - "ios/calorietracker/Info.plist"
      - "ios/calorietracker.xcodeproj/project.pbxproj"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-automation-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # Only what the store scripts and their tests read (plus the marketing
          # screenshots for the staging dry-run); never the 1.2 GB workout corpus.
          sparse-checkout: |
            /scripts/store/
            /scripts/release_notes.py
            /store/
            /APPSTORE.md
            /PLAYSTORE.md
            /requirements-store.txt
            /ios/calorietracker.xcodeproj/project.pbxproj
            /ios/calorietracker/Info.plist
            /android/app/build.gradle.kts
            /web/assets/screenshots/

      # The same pinned Python the release jobs run the store scripts on.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Print gates (must stay safe by default)
        env:
          ANDROID_RELEASE_AUTOMATION: ${{ vars.ANDROID_RELEASE_AUTOMATION }}
          ANDROID_UPLOAD_LISTING: ${{ vars.ANDROID_UPLOAD_LISTING }}
          ANDROID_UPLOAD_WHATS_NEW: ${{ vars.ANDROID_UPLOAD_WHATS_NEW }}
          ANDROID_UPLOAD_SCREENSHOTS: ${{ vars.ANDROID_UPLOAD_SCREENSHOTS }}
          ANDROID_INTERNAL_TESTING: ${{ vars.ANDROID_INTERNAL_TESTING }}
          ANDROID_CLOSED_TESTING: ${{ vars.ANDROID_CLOSED_TESTING }}
          ANDROID_PRODUCTION_ROLLOUT: ${{ vars.ANDROID_PRODUCTION_ROLLOUT }}
          STORE_SYNC_REVENUECAT: ${{ vars.STORE_SYNC_REVENUECAT }}
          IOS_RELEASE_AUTOMATION: ${{ vars.IOS_RELEASE_AUTOMATION }}
          IOS_CREATE_VERSION: ${{ vars.IOS_CREATE_VERSION }}
          IOS_UPLOAD_BUILD: ${{ vars.IOS_UPLOAD_BUILD }}
          IOS_UPLOAD_LISTING: ${{ vars.IOS_UPLOAD_LISTING }}
          IOS_UPLOAD_WHATS_NEW: ${{ vars.IOS_UPLOAD_WHATS_NEW }}
          IOS_UPLOAD_SCREENSHOTS: ${{ vars.IOS_UPLOAD_SCREENSHOTS }}
          IOS_SUBMIT_REVIEW: ${{ vars.IOS_SUBMIT_REVIEW }}
          IOS_PUBLIC_RELEASE: ${{ vars.IOS_PUBLIC_RELEASE }}
        run: python3 scripts/store/print_gates.py --platform all

      - name: Test iOS release switches, build wait, build selection and redaction (offline)
        run: python3 -m unittest scripts/store/test_ios_release.py

      - name: Test Android release switches, artifact checks, Play checks and signing files (offline)
        run: python3 -m unittest scripts/store/test_android_release.py

      - name: Validate IAP / subscription / tip catalog
        run: python3 scripts/store/validate_catalog.py

      - name: Prepare What's New (dry-run)
        run: python3 scripts/store/prepare_whats_new.py --platform all --tag dry-run --out "$RUNNER_TEMP/whatsnew"

      - name: Prepare listing text (dry-run)
        run: python3 scripts/store/prepare_listing_text.py --platform all --out "$RUNNER_TEMP/listing"

      - name: Prepare repo metadata layout (no store APIs)
        run: |
          python3 scripts/store/prepare_listing_text.py --platform all --out store/metadata
          python3 scripts/store/prepare_whats_new.py --platform all --tag dry-run --out store/metadata
          if compgen -G "web/assets/screenshots/*.png" > /dev/null; then
            python3 scripts/store/stage_screenshots.py --dry-run
          else
            echo "skip stage_screenshots dry-run (no web/assets/screenshots/*.png in checkout)"
          fi

      - name: Validate ASC / Play publisher scripts (import + --dry-run, no network)
        run: |
          python3 scripts/store/asc_release.py --help
          python3 scripts/store/play_listing.py --help
          UPLOAD_LISTING=true UPLOAD_WHATS_NEW=true SUBMIT_IOS_REVIEW=true PUBLIC_RELEASE=false \
            python3 scripts/store/asc_release.py --dry-run --metadata-dir store/metadata \
            --build-id DRY-RUN --build-number 1
          python3 scripts/store/ios_release.py --help
          python3 scripts/store/android_release.py --help
          UPLOAD_LISTING=true \
            python3 scripts/store/play_listing.py --dry-run --metadata-dir store/metadata

      - name: RevenueCat catalog dry-run
        env:
          STORE_SYNC_REVENUECAT: "false"
        run: python3 scripts/store/sync_revenuecat_catalog.py

      # Release jobs install this hash-locked set before touching a store, so a
      # broken pin (e.g. a Dependabot bump) fails here instead of in a release.
      - name: Install and import the store tooling (no store calls)
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt
          python3 -c "import jwt, googleapiclient.discovery, google.oauth2.service_account, PIL.Image; print('store tooling imports OK')"

      - name: Upload prepared artifacts (inspection only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-metadata-dry-run
          path: |
            ${{ runner.temp }}/whatsnew
            ${{ runner.temp }}/listing
          if-no-files-found: error
