# Android release CI — the Play-side sibling of the Xcode Cloud "Release" workflow.
#
# Trigger:  push a tag starting with "android-v" (e.g. android-v3.0). iOS uses
#           plain v* tags for Xcode Cloud, so the two pipelines never collide.
# Output:   a signed AAB uploaded to Play production as a DRAFT, and the same
#           version assigned to Open testing (Play track "beta") as completed
#           so testers can install it. Production stays a draft until you press
#           "Roll out" (or flip STORE_PRODUCTION_ROLLOUT — see store/README.md).
#
# Future-proof gates (repo Variables; all default OFF — see store/gates.env.example):
#   STORE_UPLOAD_WHATS_NEW / STORE_UPLOAD_LISTING / STORE_UPLOAD_SCREENSHOTS
#   STORE_PRODUCTION_ROLLOUT  (completed instead of draft — do NOT enable yet)
#   STORE_SYNC_REVENUECAT     (IAP catalog sync — write path not implemented)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     base64 of fudai-release.jks (the upload key)
#   ANDROID_KEYSTORE_PASSWORD   store password
#   ANDROID_KEY_ALIAS           key alias (fudai)
#   ANDROID_KEY_PASSWORD        key password
#   PLAY_SERVICE_ACCOUNT_JSON   the play-publisher service-account JSON key
#
# versionCode discipline stays in the repo: bump it in app/build.gradle.kts
# BEFORE tagging — Play rejects a versionCode it has already seen.
#
# Supply-chain: the AAB/APK attached to the GitHub Release are signed keylessly
# with Sigstore cosign (a *.sigstore.json bundle per artifact) and carry a
# GitHub build-provenance attestation. Verify a download with:
#   cosign verify-blob fudai-vX.Y.apk --bundle fudai-vX.Y.apk.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/apoorvdarshan/fud-ai/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify fudai-vX.Y.apk --repo apoorvdarshan/fud-ai

name: Android Release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  release:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # Sigstore keyless signing + provenance (OIDC token)
      attestations: write # store the build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare reviewed release notes
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Print store gates + validate IAP catalog
        env:
          STORE_UPLOAD_WHATS_NEW: ${{ vars.STORE_UPLOAD_WHATS_NEW }}
          STORE_UPLOAD_LISTING: ${{ vars.STORE_UPLOAD_LISTING }}
          STORE_UPLOAD_SCREENSHOTS: ${{ vars.STORE_UPLOAD_SCREENSHOTS }}
          STORE_PRODUCTION_ROLLOUT: ${{ vars.STORE_PRODUCTION_ROLLOUT }}
          STORE_SUBMIT_IOS_REVIEW: ${{ vars.STORE_SUBMIT_IOS_REVIEW }}
          STORE_SYNC_REVENUECAT: ${{ vars.STORE_SYNC_REVENUECAT }}
        run: |
          python3 scripts/store/print_gates.py
          python3 scripts/store/validate_catalog.py

      - name: Normalize store gates
        id: gates
        env:
          STORE_UPLOAD_WHATS_NEW: ${{ vars.STORE_UPLOAD_WHATS_NEW }}
          STORE_UPLOAD_LISTING: ${{ vars.STORE_UPLOAD_LISTING }}
          STORE_UPLOAD_SCREENSHOTS: ${{ vars.STORE_UPLOAD_SCREENSHOTS }}
          STORE_PRODUCTION_ROLLOUT: ${{ vars.STORE_PRODUCTION_ROLLOUT }}
        run: |
          normalize() {
            case "$(printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|on) printf '%s' 'true' ;;
              *) printf '%s' 'false' ;;
            esac
          }
          {
            echo "upload_whats_new=$(normalize "$STORE_UPLOAD_WHATS_NEW")"
            echo "upload_listing=$(normalize "$STORE_UPLOAD_LISTING")"
            echo "upload_screenshots=$(normalize "$STORE_UPLOAD_SCREENSHOTS")"
            echo "production_rollout=$(normalize "$STORE_PRODUCTION_ROLLOUT")"
          } >> "$GITHUB_OUTPUT"
          if [ "$(normalize "$STORE_PRODUCTION_ROLLOUT")" = "true" ]; then
            echo "play_status=completed" >> "$GITHUB_OUTPUT"
            echo "WARNING: STORE_PRODUCTION_ROLLOUT is on — Play will go beyond draft"
          else
            echo "play_status=draft" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare What's New + listing text (local only)
        run: |
          python3 scripts/store/prepare_whats_new.py --platform play --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/store-meta"
          python3 scripts/store/prepare_listing_text.py --platform play --out "$RUNNER_TEMP/store-meta"

      - name: Materialize upload keystore
        working-directory: android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fudai-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/fudai-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed AAB + APK
        working-directory: android
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - name: Stage release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          mkdir -p "$RUNNER_TEMP/dist"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/dist/fudai-v${VERSION}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/fudai-v${VERSION}.apk"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts (Sigstore keyless)
        working-directory: ${{ runner.temp }}/dist
        run: |
          for artifact in *.aab *.apk; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
          ls -l

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*.aab
            ${{ runner.temp }}/dist/*.apk

      - name: Stage marketing screenshots (when screenshot upload gate is on)
        if: steps.gates.outputs.upload_screenshots == 'true'
        env:
          STORE_UPLOAD_SCREENSHOTS: "true"
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt
          python3 scripts/store/stage_screenshots.py

      - name: Play listing / screenshots upload (gated)
        if: >-
          steps.gates.outputs.upload_listing == 'true' ||
          steps.gates.outputs.upload_screenshots == 'true'
        env:
          UPLOAD_LISTING: ${{ steps.gates.outputs.upload_listing }}
          UPLOAD_SCREENSHOTS: ${{ steps.gates.outputs.upload_screenshots }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt
          python3 scripts/store/play_listing.py --metadata-dir "$RUNNER_TEMP/store-meta"

      - name: Play listing / screenshots upload (skipped)
        if: >-
          steps.gates.outputs.upload_listing != 'true' &&
          steps.gates.outputs.upload_screenshots != 'true'
        run: echo "Play listing/screenshot upload skipped (gates off)"

      - name: RevenueCat catalog sync (gated)
        env:
          STORE_SYNC_REVENUECAT: ${{ vars.STORE_SYNC_REVENUECAT }}
        run: python3 scripts/store/sync_revenuecat_catalog.py

      - name: Upload to Play Console (production track, draft/default)
        if: steps.gates.outputs.upload_whats_new != 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.apoorvdarshan.calorietracker
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: ${{ steps.gates.outputs.play_status }}

      - name: Upload to Play Console (with What's New)
        if: steps.gates.outputs.upload_whats_new == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.apoorvdarshan.calorietracker
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: ${{ steps.gates.outputs.play_status }}
          whatsNewDirectory: ${{ runner.temp }}/store-meta/play

      - name: Publish the same build to Play open testing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD_WHATS_NEW: ${{ steps.gates.outputs.upload_whats_new }}
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt
          VCODE=$(grep -m1 'versionCode = ' android/app/build.gradle.kts | tr -dc '0-9')
          ARGS=(--version-code "$VCODE")
          if [ "$UPLOAD_WHATS_NEW" = "true" ]; then
            ARGS+=(--whats-new-dir "$RUNNER_TEMP/store-meta/play")
          fi
          python3 scripts/store/play_open_testing.py "${ARGS[@]}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          VCODE=$(grep -m1 'versionCode = ' android/app/build.gradle.kts | tr -dc '0-9')
          gh release create "$GITHUB_REF_NAME" \
            --title "Android ${VERSION} (versionCode ${VCODE})" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest \
            "$RUNNER_TEMP/dist/fudai-v${VERSION}.aab" \
            "$RUNNER_TEMP/dist/fudai-v${VERSION}.aab.sigstore.json" \
            "$RUNNER_TEMP/dist/fudai-v${VERSION}.apk" \
            "$RUNNER_TEMP/dist/fudai-v${VERSION}.apk.sigstore.json"
