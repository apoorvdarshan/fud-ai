# iOS release bookkeeping — the GitHub-Releases sibling of the Xcode Cloud
# "Release" workflow. Xcode Cloud does the real work (archive + upload to App
# Store Connect); this creates the GitHub Release entry from the same ios-v* tag.
# Xcode Cloud's start condition must also be tag ios-v*, or the IPA will not upload.
#
# Future-proof store gates (repo Variables; all default OFF — see store/README.md):
#   STORE_SUBMIT_IOS_REVIEW   submit ASC build for review (requires ASC API secrets)
#   STORE_UPLOAD_LISTING / STORE_UPLOAD_SCREENSHOTS
#   STORE_UPLOAD_WHATS_NEW    Play-only (What's New on Play upload); not an iOS gate
#   STORE_SYNC_REVENUECAT     IAP/subscription catalog sync (write path not implemented)
#
# ASC secrets (add later when enabling gates — not required for GitHub Release):
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_P8
#
# Published as a normal GitHub release immediately (Apoorv's preference — store
# review lag doesn't gate the GitHub entry). Live App Store submit stays OFF.

name: iOS Release (GitHub entry)

on:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  github-release:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare reviewed release notes
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Print store gates + validate IAP catalog
        env:
          STORE_UPLOAD_WHATS_NEW: ${{ vars.STORE_UPLOAD_WHATS_NEW }}
          STORE_UPLOAD_LISTING: ${{ vars.STORE_UPLOAD_LISTING }}
          STORE_UPLOAD_SCREENSHOTS: ${{ vars.STORE_UPLOAD_SCREENSHOTS }}
          STORE_OPEN_TESTING_ROLLOUT: ${{ vars.STORE_OPEN_TESTING_ROLLOUT }}
          STORE_PRODUCTION_ROLLOUT: ${{ vars.STORE_PRODUCTION_ROLLOUT }}
          STORE_SUBMIT_IOS_REVIEW: ${{ vars.STORE_SUBMIT_IOS_REVIEW }}
          STORE_SYNC_REVENUECAT: ${{ vars.STORE_SYNC_REVENUECAT }}
        run: |
          python3 scripts/store/print_gates.py
          python3 scripts/store/validate_catalog.py

      - name: Normalize store gates
        id: gates
        env:
          STORE_SUBMIT_IOS_REVIEW: ${{ vars.STORE_SUBMIT_IOS_REVIEW }}
          STORE_UPLOAD_LISTING: ${{ vars.STORE_UPLOAD_LISTING }}
          STORE_UPLOAD_SCREENSHOTS: ${{ vars.STORE_UPLOAD_SCREENSHOTS }}
        run: |
          normalize() {
            case "$(printf '%s' "${1:-}" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|on) printf '%s' 'true' ;;
              *) printf '%s' 'false' ;;
            esac
          }
          {
            echo "submit_ios_review=$(normalize "$STORE_SUBMIT_IOS_REVIEW")"
            echo "upload_listing=$(normalize "$STORE_UPLOAD_LISTING")"
            echo "upload_screenshots=$(normalize "$STORE_UPLOAD_SCREENSHOTS")"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare What's New + listing text (local only)
        run: |
          python3 scripts/store/prepare_whats_new.py --platform ios --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/store-meta"
          python3 scripts/store/prepare_listing_text.py --platform ios --out "$RUNNER_TEMP/store-meta"

      - name: Stage marketing screenshots (when screenshot upload gate is on)
        if: steps.gates.outputs.upload_screenshots == 'true'
        env:
          STORE_UPLOAD_SCREENSHOTS: "true"
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt
          python3 scripts/store/stage_screenshots.py

      - name: App Store Connect metadata / submit (gated)
        if: >-
          steps.gates.outputs.submit_ios_review == 'true' ||
          steps.gates.outputs.upload_listing == 'true' ||
          steps.gates.outputs.upload_screenshots == 'true'
        env:
          SUBMIT_IOS_REVIEW: ${{ steps.gates.outputs.submit_ios_review }}
          UPLOAD_LISTING: ${{ steps.gates.outputs.upload_listing }}
          UPLOAD_SCREENSHOTS: ${{ steps.gates.outputs.upload_screenshots }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt
          MARKETING_VERSION="${GITHUB_REF_NAME#ios-v}"
          python3 scripts/store/asc_release.py \
            --metadata-dir "$RUNNER_TEMP/store-meta" \
            --version "$MARKETING_VERSION"

      - name: App Store Connect metadata / submit (skipped)
        if: >-
          steps.gates.outputs.submit_ios_review != 'true' &&
          steps.gates.outputs.upload_listing != 'true' &&
          steps.gates.outputs.upload_screenshots != 'true'
        run: echo "ASC metadata/submit skipped (gates off) — Xcode Cloud still owns the IPA upload"

      - name: RevenueCat catalog sync (gated)
        env:
          STORE_SYNC_REVENUECAT: ${{ vars.STORE_SYNC_REVENUECAT }}
        run: python3 scripts/store/sync_revenuecat_catalog.py

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' ios/calorietracker.xcodeproj/project.pbxproj | tr -dc '0-9.')
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' ios/calorietracker.xcodeproj/project.pbxproj | tr -dc '0-9')
          gh release create "$GITHUB_REF_NAME" \
            --title "iOS ${VERSION} (build ${BUILD})" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
