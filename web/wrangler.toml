name = "fud-ai"
main = "worker.ts"
compatibility_date = "2026-07-10"
workers_dev = false
preview_urls = false

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/star-history.svg", "/star-history.json", "/api/challenge/v1/*", "/api/hosted-ai/v1/*", "/api/discord/interactions", "/api/meal-shares", "/m/*"]

# Discord slash-command Interactions Endpoint (public; not a secret).
# Set Interactions Endpoint URL in Discord Developer Portal to:
#   https://fud-ai.app/api/discord/interactions
#
# Secrets (never commit values):
#   npx wrangler secret put DISCORD_GEMINI_API_KEY   # /ask (free-tier Gemini only)
#   npx wrangler secret put GITHUB_TOKEN             # star history + /bug issues
# GITHUB_TOKEN must be able to create issues (issues:write) on apoorvdarshan/fud-ai.
[vars]
DISCORD_PUBLIC_KEY = "0ce6e6014282b489ce0930fad550e978c7d623cc71040d14250223110a9a9f57"
DISCORD_APPLICATION_ID = "1548469419922038845"

[[kv_namespaces]]
binding = "STAR_HISTORY"
id = "3576eb63eadf40f2b7f55afb75e3cd85"

[[d1_databases]]
binding = "CHALLENGE_DB"
database_name = "fud-ai-challenge"
database_id = "767c0604-d776-47be-9d58-5c7b43a1e16e"
migrations_dir = "migrations"

# Namespace IDs only need to be unique within the Cloudflare account.
[[ratelimits]]
name = "CHALLENGE_API_RATE_LIMITER"
namespace_id = "61001"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "CHALLENGE_CREATE_RATE_LIMITER"
namespace_id = "61002"

  [ratelimits.simple]
  limit = 10
  period = 60

[triggers]
crons = ["17 * * * *"]

[[routes]]
pattern = "fud-ai.app"
custom_domain = true

[[routes]]
pattern = "www.fud-ai.app"
custom_domain = true

# Provisioned by Wrangler on the first authenticated deployment. See MEAL_SHARES.md.
[[kv_namespaces]]
binding = "MEAL_SHARES"
id = "fbe7eb78e4654506b55e77a70ce623f5"

[[ratelimits]]
name = "MEAL_SHARE_CREATE_RATE_LIMITER"
namespace_id = "61003"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "MEAL_SHARE_READ_RATE_LIMITER"
namespace_id = "61004"
  [ratelimits.simple]
  limit = 120
  period = 60

# Hosted AI proxy (/api/hosted-ai/v1/*). Keyed by hashed RevenueCat app user id
# and by hashed client address. The per-user ledger in D1 (CHALLENGE_DB,
# migration 0002) enforces daily/credit quota on top of these burst limits.
# See services/hosted-ai/README.md.
[[ratelimits]]
name = "HOSTED_AI_USER_RATE_LIMITER"
namespace_id = "61005"
  [ratelimits.simple]
  limit = 40
  period = 60

[[ratelimits]]
name = "HOSTED_AI_ADDRESS_RATE_LIMITER"
namespace_id = "61006"
  [ratelimits.simple]
  limit = 120
  period = 60
